# DavMail — corporate Exchange (verified 2026-07-15). EWS mode, NTLM.
# No password here: the CalDAV client authenticates (Basic user:pass) and DavMail
# forwards those creds to Exchange via NTLM.
#
# __EXCHANGE_EWS_URL__ is substituted at container start by entrypoint.sh from
# the EXCHANGE_EWS_URL env var (docker-compose.yml -> .env). No host in git.

davmail.mode=EWS
davmail.url=__EXCHANGE_EWS_URL__

# --- LOCAL MAC TESTING ONLY: corporate proxy runs on host 127.0.0.1:2080.
# From the container that host is host.docker.internal. REMOVE/adjust on the VM,
# where Exchange is reached directly (no proxy).
davmail.enableProxy=true
davmail.proxyHost=host.docker.internal
davmail.proxyPort=2080
# --- end local proxy block

# Only CalDAV; disable the rest.
davmail.caldavPort=1080
davmail.imapPort=0
davmail.smtpPort=0
davmail.popPort=0
davmail.ldapPort=0

# Headless server, no GUI, no update nags.
davmail.server=true
davmail.disableUpdateCheck=true

# Bind inside container; compose maps it to 127.0.0.1 only.
davmail.bindAddress=0.0.0.0
davmail.allowRemote=true

# Logging to stdout for `docker logs`.
davmail.logFilePath=
davmail.logFileSize=1MB
log4j.logger.davmail=INFO
log4j.rootLogger=WARN
